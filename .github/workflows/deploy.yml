name: Déploiement Citation (master → VPS)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/nicogite/citation
  VITE_API_URL: https://citation.my-little-garden.dev

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push du frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement sur le VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull & redémarrage via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/stack/citation
            docker compose pull
            docker compose up -d
            docker image prune -f
            docker logout ghcr.io
