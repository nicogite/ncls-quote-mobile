name: Déploiement Citation (master → VPS)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/nicogite/citation
  VITE_API_URL: https://citation.my-little-garden.dev

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push du frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Déploiement sur le VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Pull & redémarrage via SSH (avec retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 6
          max_attempts: 4
          retry_wait_seconds: 25
          command: >-
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=25
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
            'echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin && cd /opt/stack/citation && docker compose pull && docker compose up -d --remove-orphans && docker image prune -f && docker logout ghcr.io'
